name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      - name: Verify package contents
        run: cargo package

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Test with all features
        run: cargo +${{ matrix.toolchain }} test --all-targets --all-features

      - name: Test without default features
        run: cargo +${{ matrix.toolchain }} test --all-targets --no-default-features
