name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'codyps/microtime'
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        timeout-minutes: 5
        run: rustup update stable

      - name: Publish unpublished packages
        # Includes nested tool downloads and their built-in retries.
        timeout-minutes: 15
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

  release-pr:
    name: Prepare release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'codyps/microtime'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        timeout-minutes: 5
        run: rustup update stable

      - name: Create or update the release PR
        # Includes nested tool downloads and their built-in retries.
        timeout-minutes: 15
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
